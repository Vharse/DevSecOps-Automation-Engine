name: Product Security Check
on:
  push:
    branches: [main, ci-updates, feat/infrastructure]
  pull_request:
    branches: [main, ci-updates, feat/infrastructure]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sast:
    uses: ./.github/workflows/sast.yml
    secrets:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  secret-scanning:
    uses: ./.github/workflows/secret-scanning.yml

  container-and-sbom:
    uses: ./.github/workflows/container-sbom.yml
    secrets:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}

  iac-and-opa:
    uses: ./.github/workflows/iac-opa.yml

  scorecard-audit:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/scorecard.yml

  siem-telemetry:
    permissions:
      contents: read
    uses: ./.github/workflows/siem-telemetry.yml
    secrets:
      ELASTIC_HOST: ${{ secrets.ELASTIC_HOST }}
      ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}

  dast:
    name: "DAST Scan"
    uses: ./.github/workflows/dast.yml
    with:
      target_url: "http://localhost:8080"
      zap_plan_path: ".zap/zap-plan.yaml"
    secrets:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
      APP_USER: ${{ secrets.APP_USER }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

  defectdojo-ingestion:
    needs: [sast, secret-scanning, container-and-sbom, iac-and-opa, scorecard-audit]
    if: always()
    uses: ./.github/workflows/defectdojo-sync.yml
    with:
      sast_job_needed: true
      container_job_needed: true
    secrets:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}

  slack-notify:
    name: Slack Webhook Notification
    runs-on: ubuntu-latest
    if: always()
    needs: [sast, secret-scanning, container-and-sbom, iac-and-opa, scorecard-audit, siem-telemetry, dast, defectdojo-ingestion]
    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA_SHORT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SAST_RES: ${{ needs.sast.result }}
          SECRET_RES: ${{ needs.secret-scanning.result }}
          CONTAINER_RES: ${{ needs.container-and-sbom.result }}
          IAC_RES: ${{ needs.iac-and-opa.result }}
          SCORECARD_RES: ${{ needs.scorecard-audit.result }}
          SIEM_RES: ${{ needs.siem-telemetry.result }}
          DAST_RES: ${{ needs.dast.result }}
          DEFECTDOJO_RES: ${{ needs.defectdojo-ingestion.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi

          STATUS="PASSED"
          ICON=":white_check_mark:"
          for res in "$SAST_RES" "$SECRET_RES" "$CONTAINER_RES" "$IAC_RES" "$SCORECARD_RES" "$SIEM_RES" "$DAST_RES" "$DEFECTDOJO_RES"; do
            if [ "$res" = "failure" ]; then
              STATUS="FAILED"
              ICON=":rotating_light:"
              break
            fi
          done

          PAYLOAD=$(jq -n \
            --arg text "${ICON} *${STATUS}* — \`${REPO}\` (\`${REF_NAME}\`)" \
            --arg details "• *Actor:* ${ACTOR} | *Commit:* \`${SHA_SHORT:0:7}\`\n• *SAST:* ${SAST_RES} | *Secrets:* ${SECRET_RES} | *Container/SBOM:* ${CONTAINER_RES} | *IaC/OPA:* ${IAC_RES}\n• *Scorecard:* ${SCORECARD_RES} | *SIEM:* ${SIEM_RES} | *DAST:* ${DAST_RES} | *DefectDojo:* ${DEFECTDOJO_RES}\n• <${RUN_URL}|View Workflow Run>" \
            '{
              text: $text,
              blocks: [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ($text + "\n" + $details) }
                }
              ]
            }')

          curl -sS -f -X POST -H "Content-Type: application/json" --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

name: "Infrastructure as Code"

on:
  workflow_call:

jobs:
  iac-and-policy:
    name: "IaC & OPA Policy Enforcement"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Open Policy Agent
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1
        with:
          version: "v0.68.0"

      - name: Run OPA Policy Unit Tests
        run: |
          if [ -d "policies/opa" ]; then
            opa test policies/opa/ -v
          fi

      - name: Render Kustomize Overlays
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered-k8s
          for overlay in k8s/overlays/local k8s/overlays/prod; do
            if [ -d "$overlay" ]; then
              env_name=$(basename "$overlay")
              kubectl kustomize "$overlay" > "/tmp/rendered-k8s/${env_name}.yaml"
            fi
          done

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@d4770c1ac4a966d8c3305b79c348c26232123aa1
        with:
          directory: /tmp/rendered-k8s
          framework: kubernetes
          soft_fail: false
          quiet: true

      - name: Evaluate OPA Rego Policies
        run: |
          if [ -d "policies/opa" ]; then
            for overlay in k8s/overlays/local k8s/overlays/prod; do
              if [ -d "$overlay" ]; then
                echo "=== Evaluating $overlay ==="
                DENIALS=$(kubectl kustomize "$overlay" \
                  | python3 -c 'import json, sys, yaml; print(json.dumps([d for d in yaml.safe_load_all(sys.stdin) if d is not None]))' \
                  | opa eval -I --format raw -d policies/opa/ "data.kubernetes.pod_security.deny")
                echo "Policy denials ($overlay): $DENIALS"
                if [ "$DENIALS" != "[]" ]; then
                  echo "::error::OPA policy violations found in $overlay: $DENIALS"
                  exit 1
                fi
              fi
            done

            if [ -f "tfplan.json" ]; then
              TF_DENIALS=$(opa eval --format raw -i tfplan.json -d policies/opa/ "data.main.deny")
              echo "Terraform policy denials: $TF_DENIALS"
              if [ "$TF_DENIALS" != "[]" ]; then
                echo "::error::OPA Terraform policy violations found: $TF_DENIALS"
                exit 1
              fi
            fi
          fi

      - name: Clean Up Rendered Manifests
        if: always()
        run: rm -rf /tmp/rendered-k8s

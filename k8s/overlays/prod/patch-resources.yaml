apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: devsecops-lab
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
